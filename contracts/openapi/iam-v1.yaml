openapi: 3.1.0
info:
  title: BossCloud IAM API
  version: 1.0.0
  description: Identity and Access Management for BossCloud.

servers:
  - url: http://localhost:8080/api/v1

paths:
  /iam/roles:
    get:
      operationId: listRoles
      summary: List roles for current tenant
      tags: [IAM]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"

    post:
      operationId: createRole
      summary: Create a custom role
      tags: [IAM]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /iam/permissions:
    get:
      operationId: listPermissions
      summary: List available permissions
      tags: [IAM]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"

  /iam/users/{user_id}/roles:
    put:
      operationId: assignUserRoles
      summary: Assign roles to a user
      tags: [IAM]
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRolesRequest"
      responses:
        "200":
          description: Roles assigned

  /iam/policy/evaluate:
    post:
      operationId: evaluatePolicy
      summary: Evaluate if actor has permission (internal)
      tags: [IAM]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluateRequest"
      responses:
        "200":
          description: Policy decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEvaluateResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: object
      required: [role_id, name, permissions, created_at]
      properties:
        role_id:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time

    RoleList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CreateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    PermissionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    Permission:
      type: object
      required: [name, description, resource]
      properties:
        name:
          type: string
        description:
          type: string
        resource:
          type: string

    AssignRolesRequest:
      type: object
      required: [role_ids]
      properties:
        role_ids:
          type: array
          items:
            type: string

    PolicyEvaluateRequest:
      type: object
      required: [actor_id, tenant_id, permission, resource]
      properties:
        actor_id:
          type: string
        tenant_id:
          type: string
        permission:
          type: string
        resource:
          type: string

    PolicyEvaluateResponse:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string

    Pagination:
      type: object
      properties:
        next_cursor:
          type: string
        has_more:
          type: boolean
