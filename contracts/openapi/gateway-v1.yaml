openapi: 3.1.0
info:
  title: VPSFlow Gateway API
  version: 1.0.0
  description: Public API gateway for VPSFlow platform.
  contact:
    name: VPSFlow Engineering

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

paths:
  /:
    get:
      operationId: getApiRoot
      summary: API root
      description: Returns gateway service information and operational status.
      tags:
        - System
      responses:
        "200":
          description: Service operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiRootResponse"

  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      tags:
        - Health
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      tags:
        - Health
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"

components:
  schemas:
    ApiRootResponse:
      type: object
      required:
        - service
        - version
        - status
      properties:
        service:
          type: string
          example: gateway
        version:
          type: string
          example: 0.1.0
        status:
          type: string
          enum: [operational]

    HealthReport:
      type: object
      required:
        - status
        - service
        - version
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    HealthCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        trace_id:
          type: string
