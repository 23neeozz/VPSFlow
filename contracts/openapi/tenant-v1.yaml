openapi: 3.1.0
info:
  title: VPSFlow Tenant API
  version: 1.0.0
  description: Organization and project management for VPSFlow.

servers:
  - url: http://localhost:8080/api/v1

paths:
  /organizations:
    get:
      operationId: listOrganizations
      summary: List organizations for current user
      tags: [Tenant]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"

    post:
      operationId: createOrganization
      summary: Create a new organization
      tags: [Tenant]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{org_id}:
    get:
      operationId: getOrganization
      summary: Get organization details
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{org_id}/members:
    get:
      operationId: listMembers
      summary: List organization members
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"

    post:
      operationId: inviteMember
      summary: Invite a new member
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Invitation sent

  /organizations/{org_id}/projects:
    get:
      operationId: listProjects
      summary: List projects in organization
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"

    post:
      operationId: createProject
      summary: Create a project
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Organization:
      type: object
      required: [org_id, name, slug, created_at]
      properties:
        org_id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time

    OrganizationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Organization"

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string

    Member:
      type: object
      required: [user_id, email, role, status]
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [active, invited, suspended]

    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string

    Project:
      type: object
      required: [project_id, name, org_id, created_at]
      properties:
        project_id:
          type: string
        name:
          type: string
        org_id:
          type: string
        created_at:
          type: string
          format: date-time

    ProjectList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
